defaults:
  route: "http://localhost:8099"
  # true skips the TLS certificate check for the default route, so anyone between you and it could read or change the traffic
  insecure: false
  payloadArchivePath: "/absolute_path_to_proj_dir/moxy/archive/"

admin:
  autoSortJsonKeys: false
  maxLogEntries: null

cors:
  # Origins besides localhost whose pages may call moxy from the browser, e.g. "http://myapp.local:3000"
  # "*" lets any website you visit read mock and proxied responses
  allowedOrigins: []
